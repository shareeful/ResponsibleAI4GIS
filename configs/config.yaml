experiment:
  name: "rai_geospatial"
  seed: 42
  output_dir: "outputs"

data:
  experiment1:
    name: "pastis_eurocrops"
    num_classes: 9
    input_channels: 10
    temporal_length: 64
    patch_size: 128
    split: [0.70, 0.15, 0.15]
    cloud_threshold: 0.20
    subgroups: ["western_eu", "central_eu", "eastern_eu"]

  experiment2:
    name: "suds_flood_risk"
    num_classes: 5
    input_channels: 14
    temporal_length: 8
    patch_size: 64
    split: [0.70, 0.15, 0.15]
    cloud_threshold: 0.20
    subgroups: ["urban_core", "suburban", "peri_urban", "rural", "industrial"]

model:
  backbone: "tsvit"
  d_model: 256
  nhead: 8
  num_encoder_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  patch_size: 16

training:
  optimizer: "adamw"
  lr: 1.0e-4
  lr_min: 1.0e-6
  epochs: 150
  patience: 15
  batch_size_exp1: 32
  batch_size_exp2: 16
  grad_clip: 1.0
  precision: "bf16"

phase1:
  epsilon_candidates: [1.5, 2.0, 3.0, 4.1, 5.0]
  epsilon_exp1: 4.1
  delta_exp1: 8.3e-6
  epsilon_exp2: 4.8
  delta_exp2: 7.1e-6
  k_anonymity: 5
  dcr_threshold: 5.0
  mia_threshold: 0.52

phase2:
  lambda1_candidates: [0.1, 0.2, 0.3, 0.5]
  lambda1: 0.3
  lambda2: 0.2
  delta_tpr_threshold: 0.05
  demographic_parity_threshold: 0.80
  sds_threshold: 15.0

phase3:
  mt_pairs_per_relation: 5000
  mt_violation_threshold: 10.0
  timestamp_shift_days: 7
  spectral_offset_pct: 5.0
  dcs_threshold: 90.0
  dcs_components:
    - "spectral_band_rationale"
    - "cloud_masking_methodology"
    - "temporal_compositing_strategy"
    - "label_provenance"
    - "geographic_coverage"
    - "model_limitations"
    - "fairness_audit_results"

phase4:
  gradcam_iou_threshold: 0.60
  nir_red_attribution_threshold: 50.0
  tac_threshold: 0.80
  nir_bands: ["B8", "B8A"]
  red_band: "B4"
  phenological_windows:
    winter_wheat: [60, 90, 150, 175]
    maize: [190, 210, 250, 275]
    rapeseed: [95, 115]
    sunflower: [210, 240]
    barley: [130, 150, 190, 210]
  # Fidelity thresholds (Petsiuk et al. 2018; Ancona et al. 2018)
  deletion_auc_threshold: 0.35       # <= : rapid degradation on high-attr removal
  insertion_auc_threshold: 0.60      # >= : rapid recovery when high-attr pixels revealed
  sensitivity_n_threshold: 0.70      # >= : Pearson correlation (attribution completeness)
  # Stability thresholds
  perturbation_stability_threshold: 0.70   # >= : Spearman under ±5% spectral offset
  seed_consistency_threshold: 0.85         # >= : mean pairwise Spearman across seeds
  # Evaluation parameters
  n_deletion_steps: 10
  sensitivity_n_subsets: 20
  sensitivity_n_ratio: 0.10
  stability_n_trials: 5

acceptance:
  utility_loss_ceiling_pp: 5.0

parc:
  probe_budget: 12          # K — number of LHS configurations
  alpha: 0.05               # one-sided significance level for τ derivation
  n_bootstrap: 500          # bootstrap replicates for reference distributions
  de_max_iter: 200          # differential-evolution iterations for max-min slack
  random_state: 42
  # Optional dataset-specific anchors for threshold derivation.
  # If omitted, domain priors (DEFAULT_THRESHOLDS) are used.
  dataset_stats: {}          # e.g. {gradcam_mean: 0.62, gradcam_std: 0.03}
