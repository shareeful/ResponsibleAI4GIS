[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haai"
version = "1.0.0"
description = "Hierarchical Agentic AI for Dynamic Cybersecurity Risk Assessment with Explainable Informed Decision Making"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "xgboost>=2.0",
]

[project.optional-dependencies]
llm = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
